name: Build

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xrobot-org/docker-image-ch32-riscv:main
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show the LibXR revision
        run: |
          git config --global --add safe.directory '*'
          git submodule status

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Firmware size
        run: riscv32-wch-elf-size build/CH32V307VC.elf

  # Compatibility canary: builds against the head of the LibXR master branch.
  # A failure here is reported but does not fail the workflow.
  libxr-master:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: ghcr.io/xrobot-org/docker-image-ch32-riscv:main
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update LibXR to master
        run: |
          git config --global --add safe.directory '*'
          git -C libxr fetch --depth 1 origin master
          git -C libxr checkout --detach FETCH_HEAD
          git -C libxr log -1 --format='LibXR master: %H %s'

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Firmware size
        run: riscv32-wch-elf-size build/CH32V307VC.elf
